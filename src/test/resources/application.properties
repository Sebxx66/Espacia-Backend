# Configuración de las pruebas automáticas: base de datos H2 en memoria, sin Docker.
# Reemplaza por completo a src/main/resources/application.properties durante "mvnw test".
spring.application.name=backend-test

app.cors.allowed-origins=http://localhost:8443

# MODE=PostgreSQL acerca el comportamiento de H2 al de PostgreSQL;
# LOCK_TIMEOUT da margen a la prueba de reservas simultáneas
spring.datasource.url=jdbc:h2:mem:bibliospace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=prueba-prueba-prueba-prueba-prueba-prueba-1234
jwt.expiration-ms=3600000

app.admin.nombre=Admin Pruebas
app.admin.email=admin@test.local
app.admin.password=admin-pruebas-123
app.seed.demo-data=false

# Las pruebas crean muchas cuentas desde la misma IP: los topes por red se prueban aparte (IpRateLimitApiTests)
app.limits.registros-por-ip-hora=100000
app.limits.registros-por-hora=100000
app.limits.correos-por-ip-hora=100000
app.limits.fallos-login-por-ip=100000
