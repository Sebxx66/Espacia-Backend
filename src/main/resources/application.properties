spring.application.name=backend

# -------------------------------------------------------------
# SERVIDOR Y CONTEXTO
# -------------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# Orígenes del frontend permitidos por CORS (Vite en local)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443,http://127.0.0.1:5173,http://127.0.0.1:8443}

# -------------------------------------------------------------
# CONEXIÓN A BASE DE DATOS (PostgreSQL)
# -------------------------------------------------------------
# Los valores por defecto coinciden con docker-compose.yml (docker compose up -d).
# Para usar otra base de datos define DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bibliospace_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:bibliospace}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------
# CONFIGURACIÓN JPA / HIBERNATE
# -------------------------------------------------------------
# 'update' creará o actualizará automáticamente las tablas según tus entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# -------------------------------------------------------------
# Clave secreta (debe tener al menos 256 bits / 32+ caracteres para HMAC-SHA256)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Tiempo de expiración del token (86400000 ms = 24 horas)
jwt.expiration-ms=86400000

# -------------------------------------------------------------
# DATOS INICIALES
# -------------------------------------------------------------
# Si no existe ningún administrador, se crea esta cuenta al arrancar.
# Cambia la contraseña desde la app después del primer ingreso.
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@bibliospace.local}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
# Crea espacios de ejemplo si la tabla de espacios está vacía
app.seed.demo-data=${SEED_DEMO_DATA:true}
# Contraseña de las cuentas de demostración (estudiantes y funcionario). Solo se crean si demo-data=true
app.seed.demo-password=${SEED_DEMO_PASSWORD:Demo12345}

# -------------------------------------------------------------
# CORREO (SMTP)
# -------------------------------------------------------------
# Gmail por defecto. Sin MAIL_USERNAME el envio queda desactivado (la app funciona igual).
# Para Gmail usa una "contrasena de aplicacion" en MAIL_PASSWORD, no tu contrasena normal.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-name=${MAIL_FROM_NAME:Espacia}

# Direccion del frontend (para el enlace de recuperar contrasena) y vigencia del enlace
app.frontend-url=${FRONTEND_URL:http://localhost:8443}
app.reset-token-minutes=60
# Minutos antes del inicio de una reserva en que se envía el recordatorio por correo
app.reminder-minutes=${REMINDER_MINUTES:60}
