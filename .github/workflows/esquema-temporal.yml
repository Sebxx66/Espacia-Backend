name: Esquema temporal
on:
  push:
    branches: [mejora/flyway-demo]
jobs:
  dump:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: espacia_db
          POSTGRES_PASSWORD: espacia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t espacia-backend .
      - name: Crear esquema con Hibernate y volcarlo
        run: |
          docker run -d --name espacia --network host -e PORT=9090 -e JWT_SECRET=$(openssl rand -hex 32) \
            -e DB_URL=jdbc:postgresql://localhost:5432/espacia_db -e DB_PASSWORD=espacia \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=create -e SPRING_FLYWAY_ENABLED=false \
            -e SEED_DEMO_DATA=false -e ADMIN_PASSWORD=$(openssl rand -hex 12) espacia-backend
          for i in $(seq 1 60); do curl -fsS http://localhost:9090/api/v1/rules >/dev/null && break; sleep 3; done
          docker logs espacia | tail -5
          docker run --rm --network host -e PGPASSWORD=espacia postgres:17-alpine \
            pg_dump -h localhost -U postgres -d espacia_db --schema-only --no-owner --no-privileges > esquema.sql
          cat esquema.sql
      - uses: actions/upload-artifact@v4
        with:
          name: esquema
          path: esquema.sql
