# Ejecuta las pruebas automáticas en cada push y en cada pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Las pruebas usan H2 en memoria: no necesitan PostgreSQL ni Docker
      - name: Pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B test
