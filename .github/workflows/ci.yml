# Ejecuta las pruebas automáticas en cada push y en cada pull request
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Las pruebas usan H2 en memoria: no necesitan PostgreSQL ni Docker
      - name: Pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B test

      # Resumen de cobertura en la página de la ejecución y reporte completo para descargar
      - name: Cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { lm+=$8; lc+=$9; bm+=$6; bc+=$7 } END {
              printf "### Cobertura de pruebas\n\n| Métrica | Cobertura |\n|---|---|\n| Líneas | %.1f %% |\n| Ramas | %.1f %% |\n", 100*lc/(lm+lc), 100*bc/(bm+bc)
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: target/site/jacoco/
          if-no-files-found: ignore

  # Respaldos en Linux y en el contenedor de docker-compose: los scripts corren dentro de la misma
  # imagen postgres:17-alpine que usa el servicio de respaldo, contra un PostgreSQL 17 real
  respaldos-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: espacia_db
          POSTGRES_PASSWORD: espacia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar respaldar.sh y restaurar.sh
        run: |
          docker run --rm --network host -e DB_PASSWORD=espacia -e BACKUP_DIR=/tmp/respaldos \
            -v "$PWD/scripts/respaldo:/scripts:ro" postgres:17-alpine sh /scripts/probar.sh

  # Respaldos en Windows (la instalación local de Espacia): PowerShell 5.1 con el PostgreSQL del equipo de GitHub
  respaldos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encender PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          & "$env:PGBIN\createdb.exe" -h localhost -U postgres -w espacia_db
      - name: Probar respaldar.ps1 y restaurar.ps1
        shell: powershell
        run: |
          & .\scripts\respaldo\probar.ps1
          exit $LASTEXITCODE

  # La imagen de Docker (la que usan Render y Railway) se construye y arranca
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: espacia_db
          POSTGRES_PASSWORD: espacia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t espacia-backend .
      - name: Arrancar y comprobar que responde
        run: |
          docker run -d --name espacia --network host -e PORT=9090 -e JWT_SECRET=$(openssl rand -hex 32) \
            -e DB_URL=jdbc:postgresql://localhost:5432/espacia_db -e DB_PASSWORD=espacia \
            -e SEED_DEMO_DATA=false -e ADMIN_PASSWORD=$(openssl rand -hex 12) espacia-backend
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/api/v1/rules > /dev/null; then echo "Responde en el puerto 9090"; exit 0; fi
            sleep 3
          done
          docker logs espacia | tail -50
          exit 1

  # Actualización de una base creada antes de Flyway (como la de producción): se crea con la versión 1.12.0
  # (ddl-auto=update y datos de demostración con el dominio anterior), y luego arranca la versión actual.
  # Flyway debe tomarla como versión 1, aplicar solo las migraciones nuevas y Hibernate validar el esquema.
  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: espacia_db
          POSTGRES_PASSWORD: espacia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Versión anterior a Flyway (1.12.0)
        uses: actions/checkout@v4
        with:
          ref: 9fd1c1de017d638c6bf2b6cca3e28a73d9741d7e
          path: anterior
      - name: Crear la base con la versión anterior
        run: |
          docker build -t espacia-anterior anterior
          docker run -d --name anterior --network host -e PORT=9090 -e JWT_SECRET=$(openssl rand -hex 32) \
            -e DB_URL=jdbc:postgresql://localhost:5432/espacia_db -e DB_PASSWORD=espacia \
            -e SEED_DEMO_DATA=true -e ADMIN_PASSWORD=$(openssl rand -hex 12) espacia-anterior
          for i in $(seq 1 60); do curl -fsS http://localhost:9090/api/v1/rules > /dev/null && break; sleep 3; done
          docker rm -f anterior
      - name: Arrancar la versión actual sobre esa base
        run: |
          docker build -t espacia-backend .
          docker run -d --name actual --network host -e PORT=9090 -e JWT_SECRET=$(openssl rand -hex 32) \
            -e DB_URL=jdbc:postgresql://localhost:5432/espacia_db -e DB_PASSWORD=espacia \
            -e SEED_DEMO_DATA=false -e DEMO_MODE=true -e ADMIN_PASSWORD=$(openssl rand -hex 12) espacia-backend
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/api/v1/demo > /dev/null; then break; fi
            sleep 3
          done
          docker logs actual | grep -iE "flyway|migrat|error" | head -20
          curl -fsS http://localhost:9090/api/v1/demo
      - name: Comprobar el historial de Flyway y las cuentas de demostración
        run: |
          q() { docker run --rm --network host -e PGPASSWORD=espacia postgres:17-alpine \
                  psql -h localhost -U postgres -d espacia_db -tAc "$1"; }
          echo "Historial:"; q "select version, description, success from flyway_schema_history order by installed_rank"
          test "$(q "select count(*) from flyway_schema_history where version = '1' and type = 'BASELINE'")" = "1"
          test "$(q "select count(*) from flyway_schema_history where version = '2' and success")" = "1"
          test "$(q "select count(*) from users where email in ('estudiante@bibliospace.local','julian.gomez@bibliospace.local','funcionario@bibliospace.local')")" = "0"
          test "$(q "select count(*) from users where demo and email in ('estudiante@espacia.local','funcionario@espacia.local','admin.demo@espacia.local')")" = "3"
          echo "Migración desde la versión anterior correcta"
